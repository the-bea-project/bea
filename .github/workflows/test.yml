name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bootstrap builds the trusted seed (bootstrap/seed.env) from
          # git history, so the clone can't be shallow.
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: gleam deps download
      - name: Bootstrap the compiler (trusted seed A, then B and C from compiler/src)
        run: scripts/bootstrap.sh
      - run: gleam format --check compiler/src test
      - name: The compiler's Bea sources are formatted
        run: scripts/bea format --check compiler/src
      - name: Unit tests
        run: gleam test
      - name: Put the dev launcher on the PATH
        run: echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: End-to-end tests (fixtures, exercism examples, formatter)
        run: scripts/test_examples.sh
      - name: End-to-end tests (Gleam tools, generated code, Marmot)
        run: scripts/test_tooling.sh
        env:
          BEA_TEST_MARMOT: "1"
      - name: Language server tests
        run: python3 test/lsp/test_lsp.py
      - name: Compare the trusted and the self-hosted compilers (A, B, C)
        run: scripts/verify_bootstrap.sh
