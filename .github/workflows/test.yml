name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: gleam deps download
      - run: gleam format --check src test
      - name: Unit tests
        run: gleam test
      - name: Put the dev launcher on the PATH
        run: |
          gleam build
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: End-to-end tests (fixtures, exercism examples, formatter)
        run: scripts/test_examples.sh
      - name: Language server tests
        run: python3 test/lsp/test_lsp.py
